<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ExtractLoRA — extraction documentaire structurée</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #2b3444; --tx: #e6edf3; --mut: #8b949e;
    --acc: #3fb950; --blue: #58a6ff; --amber: #d29922; --pink: #db61a2; --red: #f85149;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  body { background: var(--bg); color: var(--tx); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

  .top { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
  .brand { font-weight: 700; letter-spacing: .3px; }
  .brand span { color: var(--mut); font-weight: 400; }
  .method { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--mut); border: 1px solid var(--line); padding: 5px 10px; border-radius: 6px; }
  .method b { color: var(--acc); }

  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: calc(100vh - 53px); }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .col { padding: 22px; }
  .col.right { border-left: 1px solid var(--line); background: #0b0f16; }
  @media (max-width: 900px) { .col.right { border-left: 0; border-top: 1px solid var(--line); } }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mut); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .label::before { content: ""; width: 6px; height: 6px; background: var(--acc); }

  .drop { border: 1px dashed var(--line); border-radius: 10px; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 30px; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--acc); background: rgba(63,185,80,.05); }
  .drop .big { font-size: 15px; }
  .drop .small { color: var(--mut); font-size: 12px; font-family: var(--mono); }
  .drop img { max-width: 100%; max-height: 520px; border-radius: 6px; box-shadow: 0 20px 50px -20px #000; }
  input[type=file] { display: none; }

  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--tx); padding: 10px 16px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--acc); color: #06210d; border-color: var(--acc); font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }

  .json { font-family: var(--mono); font-size: 12.5px; line-height: 1.85; white-space: pre-wrap; word-break: break-word;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-height: 320px; }
  .k { color: var(--blue); } .s { color: var(--acc); } .n { color: var(--amber); } .p { color: var(--mut); } .bool { color: var(--pink); }
  .placeholder { color: var(--mut); }

  .badges { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 11px; color: var(--mut); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; display: flex; align-items: center; gap: 7px; }
  .badge.ok { color: var(--acc); border-color: #1c3a24; background: #0f1f14; }
  .badge.err { color: var(--red); border-color: #5c2626; background: #1d1112; }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  details { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  summary { cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
  details pre { margin-top: 10px; font-family: var(--mono); font-size: 12px; color: #b8c0c9; white-space: pre-wrap; max-height: 200px; overflow: auto; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--acc); border-radius: 50%; display: inline-block; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="top">
    <span class="dot"></span>
    <span class="brand">ExtractLoRA <span>/ extraction documentaire structurée</span></span>
    <span class="method"><b>POST</b> /extract</span>
  </div>

  <div class="wrap">
    <div class="col">
      <div class="label">document source</div>
      <label class="drop" id="drop">
        <div class="big" id="dropText">Glissez une image de facture ici</div>
        <div class="small">ou cliquez pour choisir un fichier (.png .jpg)</div>
        <input type="file" id="file" accept="image/*" />
      </label>
      <div class="row">
        <button class="primary" id="run" disabled>Extraire</button>
        <button id="reset" disabled>Réinitialiser</button>
      </div>
    </div>

    <div class="col right">
      <div class="label">sortie — application/json</div>
      <div class="json" id="out"><span class="placeholder">En attente d'un document…</span></div>
      <div class="badges" id="badges"></div>
      <details id="ocrBox" style="display:none">
        <summary>texte OCR brut</summary>
        <pre id="ocr"></pre>
      </details>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const fileInput = $("file"), drop = $("drop"), runBtn = $("run"), resetBtn = $("reset");
const out = $("out"), badges = $("badges"), ocrBox = $("ocrBox"), ocr = $("ocr"), dropText = $("dropText");
let currentFile = null;

function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return;
  currentFile = f;
  const url = URL.createObjectURL(f);
  drop.innerHTML = '<img alt="aperçu" src="' + url + '">';
  runBtn.disabled = false; resetBtn.disabled = false;
}

fileInput.addEventListener("change", (e) => setFile(e.target.files[0]));
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => setFile(e.dataTransfer.files[0]));

resetBtn.addEventListener("click", () => {
  currentFile = null; fileInput.value = "";
  drop.innerHTML = '<div class="big">Glissez une image de facture ici</div><div class="small">ou cliquez pour choisir un fichier (.png .jpg)</div>';
  drop.appendChild(fileInput);
  out.innerHTML = '<span class="placeholder">En attente d\'un document…</span>';
  badges.innerHTML = ""; ocrBox.style.display = "none";
  runBtn.disabled = true; resetBtn.disabled = true;
});

function syntax(json) {
  return json
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"([^"]+)":/g, '<span class="k">"$1"</span><span class="p">:</span>')
    .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
    .replace(/: (-?\d+\.?\d*)/g, ': <span class="n">$1</span>')
    .replace(/: (true|false|null)/g, ': <span class="bool">$1</span>');
}

runBtn.addEventListener("click", async () => {
  if (!currentFile) return;
  runBtn.disabled = true; runBtn.innerHTML = '<span class="spin"></span> extraction…';
  badges.innerHTML = ""; ocrBox.style.display = "none";
  out.innerHTML = '<span class="placeholder">OCR + adaptateur LoRA en cours…</span>';
  const t0 = performance.now();
  try {
    const fd = new FormData();
    fd.append("file", currentFile);
    const res = await fetch("/extract", { method: "POST", body: fd });
    const body = await res.json();
    const ms = Math.round(performance.now() - t0);
    if (!res.ok) {
      out.innerHTML = '<span class="placeholder">Échec.</span>';
      badges.innerHTML = '<span class="badge err"><i></i> ' + (body.detail || res.status) + '</span>';
      return;
    }
    out.innerHTML = syntax(JSON.stringify(body.extraction, null, 2));
    ocr.textContent = body.ocr_text || "(vide)";
    ocrBox.style.display = "block";
    badges.innerHTML =
      '<span class="badge"><i></i> pipeline ' + ms + ' ms</span>' +
      '<span class="badge"><i></i> adaptateur LoRA : facture</span>' +
      '<span class="badge ok"><i></i> JSON valide — schéma Pydantic</span>';
  } catch (err) {
    out.innerHTML = '<span class="placeholder">Erreur réseau.</span>';
    badges.innerHTML = '<span class="badge err"><i></i> ' + err.message + '</span>';
  } finally {
    runBtn.disabled = false; runBtn.textContent = "Extraire";
  }
});
</script>
</body>
</html>
